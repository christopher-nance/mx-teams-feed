[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-teams-feed"
version = "0.1.0.dev0"
description = "MaintainX work-request approvals -> per-site Microsoft Teams channel posts, kept current by edits and replies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# The core is standard-library only. Hosts inject HTTP, storage, tokens and images.
# tzdata: Windows and slim Linux images (python:3.12-slim) ship no zone database.
dependencies = ["tzdata"]

[project.optional-dependencies]
images = ["Pillow>=10.1"]
dev = ["pytest>=8", "ruff>=0.5", "Pillow>=10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
